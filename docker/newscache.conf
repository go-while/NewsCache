# NewsCache configuration for the container image (see Dockerfile).
# Mount your own file over /etc/newscache.conf to change it; all options are
# described in newscache.conf(5) and etc/newscache.conf-dist.
ConfigVersion 5
ServerType standalone
ListenTo DEFAULT
PidFile /run/newscache.pid
Username news
Groupname news
Admin root@localhost
SpoolDirectory /var/cache/newscache
SpoolSize 1000000
# Linked to the container's stderr, so "docker logs" shows the log.
LogDirectory /var/log/newscache

# Nobody may read or post until you allow it: mount your own copy of this
# file over /etc/newscache.conf and enable or add Client entries. Connections
# forwarded with "-p 119:119" from the host itself arrive from the container
# network (e.g. 172.17.0.1 with Docker, 10.88.0.1 with Podman); clients on
# other machines keep their own address.
AccessList {
  # Allow one network (CIDR) without login:
  #Client 192.0.2.0/24 {
  #  allow read post
  #  List *
  #  Read *
  #  PostTo *
  #  Authentication none
  #}
  # Or, instead of the Default entry below, let anyone connect who logs in
  # (user:password lines, see newscache.conf(5); mount that file too):
  #Default {
  #  allow read post
  #  List *
  #  Read *
  #  PostTo *
  #  Authentication file:/etc/newscache.users
  #}
  Default {
    allow none
  }
}

# news.blueworldhosting.com: free, no account, TLS with a verified
# certificate. See README.md for other public servers.
NewsServerList {
  Server news.blueworldhosting.com 563 {
    Read *
    PostTo *
    GroupTimeout 300
    Options ssl
  }
}
