# NewsCache configuration for the container image (see Dockerfile).
# Mount your own file over /etc/newscache.conf to change it; all options are
# described in newscache.conf(5) and etc/newscache.conf-dist.
ConfigVersion 5
ServerType standalone
ListenTo DEFAULT
PidFile /run/newscache.pid
Username news
Groupname news
Admin root@localhost
SpoolDirectory /var/cache/newscache
SpoolSize 1000000
# Linked to the container's stderr, so "docker logs" shows the log.
LogDirectory /var/log/newscache

# Clients from loopback and private networks may read and post. With
# "-p 119:119", connections from the host itself arrive from a private address
# of the container network (e.g. 172.17.0.1). Clients on other machines keep
# their own address, so add their network here to let them in.
AccessList {
  Client 127.0.0.0/8 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Client 10.0.0.0/8 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Client 172.16.0.0/12 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Client 192.168.0.0/16 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Client ::1 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Client fc00::/7 {
    allow read post
    List *
    Read *
    PostTo *
    Authentication none
  }
  Default {
    allow none
  }
}

# news.blueworldhosting.com: free, no account, TLS with a verified
# certificate. See README.md for other public servers.
NewsServerList {
  Server news.blueworldhosting.com 563 {
    Read *
    PostTo *
    GroupTimeout 300
    Options ssl
  }
}
