# /etc/newscache.conf: NewsCache configuration (Debian package).
# All options are described in newscache.conf(5) and in
# /usr/share/doc/newscache/examples/newscache.conf-dist.
# Check the file with "newscache -p", then "systemctl reload newscache".
ConfigVersion 5
ServerType standalone
ListenTo DEFAULT
# No PidFile: systemd knows the daemon's pid.
Username news
Groupname news
Admin root@localhost
SpoolDirectory /var/cache/newscache
SpoolSize 1000000

# Nobody may read or post until you allow it (see README.Debian). The first
# matching entry is used, so put Client entries before Default.
AccessList {
  # Allow one host or network (CIDR) without login:
  #Client 192.0.2.0/24 {
  #  allow read post
  #  List *
  #  Read *
  #  PostTo *
  #  Authentication none
  #}
  # Or, instead of the Default entry below, let in only clients that log in
  # (user:password-hash:*:*:*:read,post lines, see README.Debian). Don't use
  # "allow read post" here: with it, logging in would be optional.
  #Default {
  #  allow authentication
  #  List !*
  #  Read !*
  #  PostTo !*
  #  Authentication file:/etc/newscache.users
  #}
  Default {
    allow none
  }
}

# news.blueworldhosting.com: free, no account, TLS with a verified
# certificate. For plain NNTP use port nntp (119) without "Options ssl".
NewsServerList {
  Server news.blueworldhosting.com 563 {
    Read *
    PostTo *
    GroupTimeout 300
    Options ssl
  }
}
