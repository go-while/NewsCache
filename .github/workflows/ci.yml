# Build and test: make check (C++ unit tests and the Go end-to-end tests in
# tests/e2e) on Ubuntu in five configurations (without GnuTLS and with the
# header log as optional checks) and on ARM64, on Fedora 43, 44
# and 45 with Fedora's packaging flags, on Alpine (musl) and Debian 13 in a
# container, and in a FreeBSD VM. The default Ubuntu job also runs make
# distcheck. Windows also checks that the tree checks out cleanly on a
# case-insensitive file system.
#
# The two macOS jobs (build and test, checkout) run only when the workflow is
# started by hand (Actions, CI, "Run workflow"): GitHub's macOS runners often
# wait in the queue until the job times out. On a push or a pull request they
# are skipped, and a skipped job counts as passed for the required checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the macOS jobs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            configure: --with-pam
            distcheck: true
          - name: file log, debug
            configure: --without-syslog --enable-debug
          # Optional checks: configurations no other lane builds
          - name: without GnuTLS
            configure: --with-pam --without-gnutls
          - name: header log
            configure: --without-syslog --enable-headerlog
          - name: AddressSanitizer
            configure: --with-pam
            cxxflags: -g -O1 -fsanitize=address -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS
            ldflags: -fsanitize=address
          - name: ARM64
            configure: --with-pam
            runner: ubuntu-24.04-arm
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check e2e skip summary
        if: matrix.name == 'default'
        run: sh .github/ci/test-e2e-skip-summary.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tests/e2e/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool texinfo libgnutls28-dev libpam0g-dev

      - name: Configure
        env:
          CXXFLAGS: ${{ matrix.cxxflags || '-g -O2' }}
          LDFLAGS: ${{ matrix.ldflags }}
          CONFIGURE_FLAGS: ${{ matrix.configure }}
        run: |
          ./autogen
          # Word splitting of the flags is intended.
          # shellcheck disable=SC2086
          ./configure $CONFIGURE_FLAGS

      - name: Build
        run: make -j"$(nproc)"

      - name: Let the PAM tests write their services
        # The tests run as the runner user, never as root (as newscache
        # itself); they only need to write their PAM service files.
        run: sudo setfacl -m "u:$(id -un):rwx" /etc/pam.d

      - name: make check
        run: make check

      - name: Summarize e2e skips
        if: always()
        run: |
          if [ -f .github/ci/e2e-skip-summary.sh ]; then
            sh .github/ci/e2e-skip-summary.sh tests/e2e/run.sh.log || echo 'e2e skips: summary failed'
          else
            echo 'e2e skips: summary script missing'
          fi

      - name: Check that the e2e tests ran
        # run.sh exits 77 (skipped) without Go; in CI that must fail.
        run: |
          grep -q '^:test-result: PASS' tests/e2e/run.sh.trs

      - name: Test upstream reply deadlines with short limits
        if: matrix.name == 'file log, debug'
        run: sh .github/ci/test-short-upstream-replies.sh

      - name: e2e tests with the race detector
        if: matrix.name == 'default'
        working-directory: tests/e2e
        run: |
          status=0
          NEWSCACHE_BIN="$GITHUB_WORKSPACE/src/newscache" go test -race -v -count=1 ./... > "$RUNNER_TEMP/e2e-race.log" 2>&1 || status=$?
          sh ../../.github/ci/e2e-skip-summary.sh "$RUNNER_TEMP/e2e-race.log" || echo 'e2e skips: summary failed'
          if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/e2e-race.log"; fi
          exit "$status"

      - name: make distcheck
        if: matrix.distcheck
        # No TeX on the runner: skip the DVI manual.
        run: make distcheck TEXI2DVI=true

      - name: Show test logs
        if: failure()
        run: |
          find . -name test-suite.log -o -name 'run.sh.log' -o -name '*.trs' |
            while read -r f; do echo "===== $f"; tail -n 100 "$f"; done

  fedora:
    name: Fedora ${{ matrix.release }} (rpm flags)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['43', '44', '45']
    container: fedora:${{ matrix.release }}
    steps:
      - name: Install build dependencies
        run: |
          dnf -y -q install gcc-c++ make autoconf automake libtool \
            gnutls-devel pam-devel libxcrypt-devel texinfo \
            redhat-rpm-config golang shadow-utils util-linux acl

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: |
          CFLAGS="$(rpm --eval %optflags)"
          CXXFLAGS="$CFLAGS"
          LDFLAGS="$(rpm --eval %build_ldflags)"
          export CFLAGS CXXFLAGS LDFLAGS
          ./autogen
          ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --with-pam

      - name: Build
        run: make -j"$(nproc)"

      - name: make check, as an unprivileged user
        # The container runs as root; the tests (and the newscache they
        # start) must not. The PAM tests need to write /etc/pam.d.
        run: |
          useradd -m newscache
          chown -R newscache .
          setfacl -m u:newscache:rwx /etc/pam.d
          runuser -u newscache -- make check

      - name: Summarize e2e skips
        if: always()
        run: |
          if [ -f .github/ci/e2e-skip-summary.sh ]; then
            sh .github/ci/e2e-skip-summary.sh tests/e2e/run.sh.log || echo 'e2e skips: summary failed'
          else
            echo 'e2e skips: summary script missing'
          fi

      - name: Check that the e2e tests ran
        run: |
          grep -q '^:test-result: PASS' tests/e2e/run.sh.trs

      - name: Show test logs
        if: failure()
        run: |
          find . -name test-suite.log -o -name 'run.sh.log' -o -name '*.trs' |
            while read -r f; do echo "===== $f"; tail -n 100 "$f"; done

  linux:
    # Other Linux distributions, built and tested in a container with
    # docker run (the actions themselves can't run inside an Alpine/musl
    # container).
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine 3.24 (musl)
            image: docker.io/library/alpine:3.24
            setup: apk add -q build-base autoconf automake texinfo gnutls-dev linux-pam-dev go bash
            configure: --with-pam
          # Go from trixie-backports: trixie has Go 1.24, and the e2e tests
          # need what tests/e2e/go.mod says (1.26).
          - name: Debian 13
            image: docker.io/library/debian:13
            setup: >-
              echo 'deb http://deb.debian.org/debian trixie-backports main'
              > /etc/apt/sources.list.d/backports.list &&
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
              build-essential autoconf automake texinfo libgnutls28-dev libpam0g-dev
              ca-certificates &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
              -t trixie-backports golang-go
            configure: --with-pam
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and make check
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          CONFIGURE_FLAGS: ${{ matrix.configure }}
        run: |
          # The tree is mounted read-only and copied, so the build doesn't
          # leave root-owned files in the workspace.
          docker run --rm -v "$PWD:/src:ro" -e CONFIGURE_FLAGS "$IMAGE" sh -c "
            set -e
            $SETUP
            cp -r /src /build && cd /build
            ./autogen
            ./configure \$CONFIGURE_FLAGS
            make -j\$(nproc)
            # the tests (and the newscache they start) as an unprivileged
            # user, not as the container's root
            useradd -m newscache 2>/dev/null || adduser -D newscache
            chown -R newscache /build
            chgrp newscache /etc/pam.d && chmod g+w /etc/pam.d
            status=0
            su newscache -s /bin/sh -c 'make check' || status=\$?
            sh .github/ci/e2e-skip-summary.sh tests/e2e/run.sh.log || echo 'e2e skips: summary failed'
            if [ \"\$status\" -ne 0 ]; then find . -name test-suite.log -o -name run.sh.log | xargs tail -n 60 || true; exit \"\$status\"; fi
            grep -q '^:test-result: PASS' tests/e2e/run.sh.trs
          "

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and make check in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: pkg install -y autoconf automake gmake texinfo gnutls go
          run: |
            set -e
            ./autogen
            ./configure CPPFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib
            gmake -j"$(sysctl -n hw.ncpu)"
            # the tests (and the newscache they start) not as root
            pw useradd newscache -m
            chown -R newscache .
            status=0
            su -m newscache -c 'HOME=/home/newscache gmake check' || status=$?
            sh .github/ci/e2e-skip-summary.sh tests/e2e/run.sh.log || echo 'e2e skips: summary failed'
            if [ "$status" -ne 0 ]; then find . -name test-suite.log -o -name run.sh.log | xargs tail -n 60 || true; exit "$status"; fi
            grep -q '^:test-result: PASS' tests/e2e/run.sh.trs

  container:
    # Builds the Dockerfile and checks that the daemon answers through a
    # forwarded port. Doesn't fetch from the upstream server, so a problem
    # there can't fail the job.
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t newscache .

      - name: Nobody is allowed by default
        run: |
          docker run -d --name newscache -p 1119:119 newscache
          greeting=$(./.github/nntp-greeting.sh 127.0.0.1 1119)
          echo "greeting: $greeting"
          case "$greeting" in "502 "*) ;; *) exit 1 ;; esac
          test "$(docker exec newscache stat -c %U /proc/1)" = news
          docker exec newscache newscacheclean

      - name: A mounted config lets the container network in
        run: |
          # Connections forwarded with -p come from the Docker network.
          awk '/^  Default \{$/ && !done { print "  Client 172.16.0.0/12 {\n    allow read post\n    List *\n    Read *\n    PostTo *\n    Authentication none\n  }"; done=1 } { print }' \
            docker/newscache.conf > allow.conf
          grep -n 'Client 172.16.0.0/12' allow.conf
          docker run -d --name newscache-allowed -p 1120:119 \
            -v "$PWD/allow.conf:/etc/newscache.conf:ro" newscache
          greeting=$(./.github/nntp-greeting.sh 127.0.0.1 1120)
          echo "greeting: $greeting"
          case "$greeting" in "200 NewsCache "*) ;; *) exit 1 ;; esac

      - name: Show container logs
        if: always()
        run: |
          for c in newscache newscache-allowed; do
            echo "===== $c"; docker logs "$c" 2>&1 | tail -n 30 || true
          done

  checkout:
    # Windows and macOS file systems are case-insensitive: two tracked files
    # whose names differ only in case can't both be checked out there.
    name: Checkout (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps: &checkout-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No file names that differ only in case
        run: |
          clashes=$(git ls-files | sort -f | uniq -di)
          if [ -n "$clashes" ]; then
            echo "::error::File names that differ only in case:"
            echo "$clashes"
            exit 1
          fi
          # Headers are found through -I paths across directories, so their
          # names (and configure's config.h) must differ in more than case.
          headers=$({ git ls-files '*.h' | xargs -n1 basename; echo config.h; } |
            sort -u | awk '{ l = tolower($0); if (l in s) print s[l] " and " $0; s[l] = $0 }')
          if [ -n "$headers" ]; then
            echo "::error::Header names that differ only in case:"
            echo "$headers"
            exit 1
          fi

      - name: Working tree matches the commit
        # A clash shows up here as a modified file after the checkout.
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::Files differ from the commit right after checkout:"
            echo "$dirty"
            exit 1
          fi

  checkout-macos:
    name: Checkout (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps: *checkout-steps

  macos:
    name: macOS (build and test)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tests/e2e/go.sum

      - name: Install build dependencies
        run: |
          brew install autoconf automake texinfo gnutls
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          prefix=$(brew --prefix)
          ./autogen
          ./configure CPPFLAGS="-I$prefix/include" LDFLAGS="-L$prefix/lib"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: make check
        run: make check

      - name: Summarize e2e skips
        if: always()
        run: |
          if [ -f .github/ci/e2e-skip-summary.sh ]; then
            sh .github/ci/e2e-skip-summary.sh tests/e2e/run.sh.log || echo 'e2e skips: summary failed'
          else
            echo 'e2e skips: summary script missing'
          fi

      - name: Check that the e2e tests ran
        run: |
          grep -q '^:test-result: PASS' tests/e2e/run.sh.trs

      - name: Show test logs
        if: failure()
        run: |
          find . -name test-suite.log -o -name 'run.sh.log' -o -name '*.trs' -o -name config.log |
            while read -r f; do echo "===== $f"; tail -n 100 "$f"; done
